server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # HTML, CSS and JS keep their names between deploys, so browsers must revalidate
    # them (a cheap 304 when unchanged) instead of serving a stale copy for a month
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The resume PDF may be replaced under the same name — cache it briefly
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Images, fonts and 3D/media assets rarely change: cache for a month
    location ~* \.(?:jpg|jpeg|gif|png|webp|avif|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|otf|eot|glb|gltf|bin)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 page redirect to index
    error_page 404 /index.html;

    # Health check endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
